[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-mcp"
version = "0.1.0"
description = "MCP server, relay backend, and tool registry for Excel add-ins"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn",
  "httpx~=0.27.0",
  "fastmcp",
  "mcp",
  "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["excel_mcp*"]
